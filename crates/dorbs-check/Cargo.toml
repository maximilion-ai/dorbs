[package]
name = "dorbs-check"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
globset = "0.4.21"
indexmap = { version = "2.14.2", features = ["serde"] }
libc = "0.2.191"
quick-xml = "0.42.0"
rand_core = { version = "0.6", features = ["getrandom"] }
regex = "1.13.1"
rsa = { version = "0.9.10", features = ["sha2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "time",
  "sync",
  "io-util",
  "fs",
  "net",
  "signal",
] }
toml = { version = "1.1.8", features = ["preserve_order"] }
