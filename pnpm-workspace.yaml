packages:
  - apps/*
  - packages/*

catalog:
  # The AI SDK model contract OpenCode loads; matches the one @opencode/core depends on.
  "@ai-sdk/provider": 3.0.19
  "@alchemy.run/cloudflare": 2.0.0-beta.84
  "@cloudflare/computer": 0.8.0
  "@cloudflare/vitest-plugin": 1.4.9
  # 5.20261028.1 is newer than pnpm's minimumReleaseAge allows.
  "@cloudflare/workers-types": 5.20261027.1
  # agents supports one Pi minor at a time.
  "@earendil-works/chord": 1.4.0
  "@earendil-works/pi-ai": 1.4.0
  "@earendil-works/pi-durable": 1.4.0
  "@effect/platform-node": 4.0.6
  "@effect/vitest": 4.0.6
  # @cloudflare/computer/git imports it at runtime to give isomorphic-git a filesystem.
  "@platformatic/vfs": 0.5.0
  # Must match the oxlint that vite-plus bundles, which loads our JS plugin.
  "@oxlint/plugins": 1.89.0
  # 2.2.3 is the first to run plugins' AI SDK hooks before its npm installer, which cannot run on workerd.
  "@opencode/plugin": 2.2.3
  "@opencode/sdk": 2.2.3
  "@types/node": 26.6.5
  agents: 0.31.0
  alchemy: 2.0.0-beta.84
  # effect 4.0.7 is newer than pnpm's minimumReleaseAge allows.
  effect: 4.0.6
  # The agent-worker tests prebundle OpenCode with it; wrangler and alchemy already pin it.
  esbuild: 0.28.2
  knip: 6.43.0
  # pako 1, as isomorphic-git pins: pako 2 reads on past a stream's end, into the next packfile object.
  pako: 1.0.11
  tsrs: 0.20.0-ts7.1.0-beta
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5
  zod: 4.6.6

# One vite and one vitest across the tree, so @effect/vitest and
# @cloudflare/vitest-plugin share the runner that vite-plus bundles.
overrides:
  effect: "catalog:"
  vite: "catalog:"
  vitest: "catalog:"
  # OpenCode's packages want ws 8.21.0 and 8.22.0, which puts two copies of @opencode/core in the Worker.
  ws: 8.22.0

peerDependencyRules:
  allowedVersions:
    vite: "*"

# workerd and esbuild download their native binaries in postinstall.
allowBuilds:
  esbuild: true
  workerd: true
  "@google/genai": false
  # OpenCode's native file watcher and shell parsers, which its workerd profile does not load.
  "@parcel/watcher": false
  tree-sitter-bash: false
  tree-sitter-powershell: false
  core-js-pure: false
  protobufjs: false

# OpenCode 2.2.3 was published 2026-10-30T09:51Z, inside the release-age window; drop this once it passes.
minimumReleaseAgeExclude:
  - "@opencode/ai@2.2.3"
  - "@opencode/client@2.2.3"
  - "@opencode/codemode@2.2.3"
  - "@opencode/core@2.2.3"
  - "@opencode/plugin-browser@2.2.3"
  - "@opencode/plugin@2.2.3"
  - "@opencode/protocol@2.2.3"
  - "@opencode/schema@2.2.3"
  - "@opencode/sdk@2.2.3"
  - "@opencode/server@2.2.3"
  - "@opencode/simulation@2.2.3"
  - "@opencode/util@2.2.3"

# The patch gives Computer's git a pako Inflate on runtimes whose node:zlib cannot report consumed bytes (celld).
# pako 1, as isomorphic-git pins: pako 2 reads on past a stream's end, into the next packfile object.
packageExtensions:
  "@cloudflare/computer@0.8.0":
    dependencies:
      pako: 1.0.11

patchedDependencies:
  "@cloudflare/computer@0.8.0": patches/@cloudflare__computer@0.8.0.patch
